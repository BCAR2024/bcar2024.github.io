document.addEventListener('click',function(e){var mode=e.target.closest('[data-mode]');if(mode){state.mode=mode.dataset.mode;save();qa('[data-mode]').forEach(function(x){x.classList.remove('ok')});mode.classList.add('ok');return}var pane=e.target.closest('[data-pane]');if(pane){openPane(pane.dataset.pane);return}var qb=e.target.closest('[data-question]');if(qb){var n=qb.dataset.question,order=['pending','answered','partial','none','na'],cur=order.indexOf(state.questions[n]||'pending');state.questions[n]=order[(cur+1)%order.length];save();renderPanes();openPane('questions');return}var att=e.target.closest('[data-add-attendance]');if(att){var name=prompt('اسم الحاضر وصفته');if(name){state.attendance[att.dataset.addAttendance].push({name:name,time:now()});save();renderPanes();openPane('registers')}return}});
q('#begin').addEventListener('click',function(){if(!state.mode){alert('اختر وضع التشغيل');return}if(!q('#confirm').checked){alert('أكد القاعدة الحاكمة');return}state.settings.place=q('#place').value;state.settings.bailiff=q('#bailiff').value;state.started=true;save();render()});
q('#saveStep').addEventListener('click',function(){var st=stepState();st.outcome=q('#outcome').value;st.notes=q('#notes').value;st.complete=!!st.outcome;st.time=now();log('مرحلة','اعتماد '+STEPS[state.current].id,st.outcome+' | '+st.notes);save();render()});
q('#prev').addEventListener('click',function(){if(state.current>0){state.current--;save();render()}});
q('#next').addEventListener('click',function(){if(state.current<STEPS.length-1){state.current++;save();render()}});
document.addEventListener('click',function(e){if(e.target.id==='addAttachment'){var text=q('#attachmentText').value.trim();if(text){state.attachments.ago.push({text:text,time:now()});save();renderPanes();openPane('registers')}}if(e.target.id==='exportJson')download('ATC_v7.1_clean_state.json',JSON.stringify(state,null,2));if(e.target.id==='copyBrief'){var t=brief();q('#brief').textContent=t;if(navigator.clipboard)navigator.clipboard.writeText(t).catch(function(){})}if(e.target.id==='runTest'){var t=diagnostics();q('#testResult').innerHTML='<div class="notice '+(t.every(function(x){return x[1]})?'ok':'bad')+'">'+t.map(function(x){return (x[1]?'✅':'❌')+' '+esc(x[0])}).join('<br>')+'</div>'}});
window.addEventListener('error',function(e){console.error(e.error||e.message)});
render();
</script>
</body>
</html>
